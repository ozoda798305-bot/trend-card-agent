# 매일 아침 8시(한국 시각)에 후보 찾기만 자동으로 돌리고, 결과를 daily/ 폴더에 올린다.
# 웹 앱(Streamlit)이 다시 시작되며 daily/ 의 최신 후보 표를 보여 준다. 고르기·카드·승인·예약은 사람이 한다.
# 키: 저장소 Settings → Secrets and variables → Actions 에 YOUTUBE_API_KEY, GEMINI_API_KEY
name: daily-find
on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 한국 08:00 (GitHub 사정으로 몇십 분 늦을 수 있다)
  workflow_dispatch: {}      # Actions 화면에서 손으로도 돌릴 수 있다
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytrends pandas
      - run: python run_pipeline.py find
      - name: daily/ 에 올리기
        run: |
          mkdir -p daily
          latest=$(ls -d 04_자료/run_* | sort | tail -1)
          cp -r "$latest" daily/
          git config user.name "daily-find-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily
          git commit -m "매일 후보 찾기 $(date +%F)" && git push || echo "바뀐 것 없음"
