# 매주 월요일 아침 8시(한국 시각)에 후보 찾기만 자동으로 돌리고, 결과를 daily/ 폴더에 올린다.
# 끝나면 「이번 주 후보」 GitHub 이슈를 만들어 운영자에게 이메일 알림을 보낸다(확인·승인은 웹 앱에서).
# 웹 앱(Streamlit)이 다시 시작되며 daily/ 의 최신 후보 표를 보여 준다. 고르기·카드·승인·예약은 사람이 한다.
# 키: 저장소 Settings → Secrets and variables → Actions 에 YOUTUBE_API_KEY, GEMINI_API_KEY
name: daily-find
on:
  schedule:
    - cron: "0 23 * * 0"   # UTC 일요일 23:00 = 한국 월요일 08:00 (GitHub 사정으로 몇십 분 늦을 수 있다)
  workflow_dispatch: {}      # Actions 화면에서 손으로도 돌릴 수 있다
permissions:
  contents: write
  issues: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytrends pandas
      - run: python run_pipeline.py find
      - name: daily/ 에 올리기
        run: |
          mkdir -p daily
          latest=$(ls -d 04_자료/run_* | sort | tail -1)
          cp -r "$latest" daily/
          echo "RUN_DIR=daily/$(basename "$latest")" >> "$GITHUB_ENV"
          git config user.name "daily-find-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily
          git commit -m "이번 주 후보 찾기 $(date +%F)" || echo "바뀐 것 없음"
          git pull --rebase -q && git push
      - name: 이번 주 후보 알림(GitHub 이슈 → 이메일)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python daily_notify.py "$RUN_DIR" title.txt body.md
          gh label create daily --color FFD43B --description "아침 자동 실행 알림" --force
          for n in $(gh issue list --label daily --state open --json number --jq '.[].number'); do gh issue close "$n"; done
          gh issue create --title "$(cat title.txt)" --body-file body.md --label daily
